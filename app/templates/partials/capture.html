{% macro face_capture(name='photo', existing=None, note=None) -%}
<input type="hidden" name="{{ name }}">
<div class="cam" data-capture data-target="{{ name }}">
  <div class="cam-placeholder">
    {% if existing %}<img src="{{ existing }}" alt="Current face photo" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">{% else %}
    <div><i data-lucide="scan-face" style="width:42px;height:42px"></i><div class="mt-1">Camera is off</div></div>{% endif %}
  </div>
  <video class="mirror" playsinline muted hidden></video>
  <img class="preview" alt="Captured face" style="transform:scaleX(-1)" hidden>
  <div class="guide"></div>
  <div class="cam-msg" hidden></div>
</div>
<div class="row mt-1 wrap">
  <button type="button" class="btn" data-cam-start><i data-lucide="camera"></i> {{ 'Retake with camera' if existing else 'Start camera' }}</button>
  <button type="button" class="btn btn-primary" data-cam-shoot hidden><i data-lucide="aperture"></i> Capture photo</button>
  <button type="button" class="btn" data-cam-retake hidden><i data-lucide="rotate-ccw"></i> Retake</button>
</div>
{% if note %}<p class="hint small muted mt-1">{{ note }}</p>{% endif %}
{%- endmacro %}
